name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Read module version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content module/fgb-native.json -Raw | ConvertFrom-Json
          "version=$($manifest.Version)" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cmake --build build --config Release --target package-module

      - name: Verify package
        shell: pwsh
        run: |
          $zip = "build/Release/pico-connect-face-${{ steps.version.outputs.version }}.zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $expected = @(
            'fgb-native.json',
            'pico-connect-face.dll',
            'icon.svg',
            'LICENSE',
            'NOTICE'
          )
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try { $names = $archive.Entries.FullName } finally { $archive.Dispose() }
          foreach ($name in $expected) {
            if ($names -notcontains $name) { throw "missing $name in $zip" }
          }
          Write-Host "package ok: $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pico-connect-face-${{ steps.version.outputs.version }}
          path: build/Release/pico-connect-face-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "build/Release/pico-connect-face-${{ steps.version.outputs.version }}.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title $tag --generate-notes
          }
